services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tecnomega_database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build:
      context: ./backend
    container_name: tecnomega_backend
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DATABASE: ${MSSQL_DATABASE}
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    container_name: tecnomega_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  sqlserver_data: