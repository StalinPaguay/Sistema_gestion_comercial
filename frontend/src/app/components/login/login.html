<main class="login-page">
  <section class="login-card" aria-labelledby="login-heading">
    <header class="login-header">
      <div class="brand" aria-label="TECNOMEGA">
        <span>TECNO</span><span class="brand-orange">MEGA</span>
      </div>
      <h1 id="login-heading">Tecnología y Soluciones a tu Alcance</h1>
      <p>Acceda a su cuenta para gestionar sus compras o administrar la tienda.</p>
    </header>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <label class="input-field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 5.5h17v13h-17z" />
          <path d="m4 6 8 6 8-6" />
        </svg>
        <input
          type="email"
          name="email"
          placeholder="Correo Electrónico"
          autocomplete="username"
          aria-label="Correo Electrónico"
          required
          email
          ngModel
        />
      </label>

      <label class="input-field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="11" rx="1.5" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          <path d="M12 14v3" />
        </svg>
        <input
          [type]="passwordVisible() ? 'text' : 'password'"
          name="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          aria-label="Contraseña"
          required
          ngModel
        />
        <button
          class="visibility-button"
          type="button"
          [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="passwordVisible()"
          (click)="togglePasswordVisibility()"
        >
          @if (passwordVisible()) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3 21 21" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5.3 0 9 7 9 7a16 16 0 0 1-3 3.7" />
              <path d="M6.2 6.2C3.9 7.7 3 12 3 12s3.7 7 9 7a9 9 0 0 0 3-.5" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" />
              <circle cx="12" cy="12" r="3" />
              <path d="m3 3 18 18" />
            </svg>
          }
        </button>
      </label>

      <button class="submit-button" type="submit" [disabled]="loginForm.invalid">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v10" />
          <path d="M7.1 5.7a8 8 0 1 0 9.8 0" />
        </svg>
        Iniciar Sesión
      </button>

      @if (feedback()) {
        <p class="form-feedback" role="status">{{ feedback() }}</p>
      }

      <div class="form-options">
        <label class="remember-option">
          <input type="checkbox" name="remember" />
          <span>Recordarme</span>
        </label>
        <p>¿No tiene cuenta? <a routerLink="/register">Regístrese Aquí</a></p>
      </div>
    </form>

    <footer class="trust-badges" aria-label="Seguridad de la tienda">
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="1" />
          <path d="M3 9h18" />
        </svg>
        Pago Seguro
      </span>
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 3 8 3v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z" />
          <path d="m9 11 2 2 4-4" />
        </svg>
        Datos Protegidos
      </span>
    </footer>
  </section>
</main>
